<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word Guess</title><link rel="stylesheet" href="/style.css"></head>
<body class="overlay-body">
<main class="frame">
  <div class="topline"><div class="brand"><span class="brand-dot"></span> WORD GUESS</div><div class="round" id="round">РАУНД 0</div></div>
  <div class="meta-row"><div class="category" id="category">ОЖИДАНИЕ РАУНДА</div><div class="countdown" id="countdown">НОВАЯ БУКВА ЧЕРЕЗ —</div></div>
  <section class="word" id="word" aria-label="Загаданное слово"><div class="placeholder">ОЖИДАНИЕ ИГРЫ</div></section>
  <div class="under-word"><span class="length" id="length">Букв: —</span><span class="hint-info" id="hintInfo"></span></div>
  <section class="attempts" id="attemptPanel"><div class="section-title">ПОСЛЕДНИЕ ПОПЫТКИ <span class="live-dot"></span></div><div class="attempt-list" id="attempts"><span class="empty">Пока никто не отвечал</span></div></section>
  <div class="status" id="status">Ожидание запуска</div>
</main><script src="/overlay.js"></script></body></html>
